name: fl_state_lifecycle
description: >-
  Flutter State lifecycle toolkit: page & app lifecycle callbacks via mixins,
  a type-safe event bus.
version: 0.1.3
homepage: https://github.com/LqDeveloper/fl_state_lifecycle
repository: https://github.com/LqDeveloper/fl_state_lifecycle
issue_tracker: https://github.com/LqDeveloper/fl_state_lifecycle/issues
topics:
  - lifecycle
  - event-bus
  - indexed-stack
  - state-management

environment:
  sdk: ^3.1.0
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  #dart pub run import_sorter:main
  import_sorter: ^4.6.0
import_sorter:
  emojis: false # Optional, defaults to false
  comments: false # Optional, defaults to true
  ignored_files: # Optional, defaults to []
    - \/lib\/fl_state_lifecycle.dart